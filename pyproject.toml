[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "objectwire-worldcup"
version = "1.0.0"
description = "AI-powered World Cup 2026 journalism agent for ObjectWire.org"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.3.0",
    "feedparser>=6.0.11",
    "python-dateutil>=2.9.0",
    "asyncio-mqtt>=0.13.0",
    "websockets>=11.0.2",
]

[project.scripts]
worldcup = "worldcup_cli:cli"
objectwire-worldcup = "worldcup_cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["."]
